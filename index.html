<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Calculadora</title>
  </head>
  <body>
    <h1>CALCULADORA</h1>

    <div class="calculator-layout">
      <div class="wrapper">
        <section class="screen">0</section>

        <section class="calc-buttons">
          <div class="calc-button-row">
            <button class="calc-button double">C</button>
            <button class="calc-button">&larr;</button>
            <button class="calc-button">&divide;</button>
          </div>
          <div class="calc-button-row">
            <button class="calc-button">7</button>
            <button class="calc-button">8</button>
            <button class="calc-button">9</button>
            <button class="calc-button">&times;</button>
          </div>
          <div class="calc-button-row">
            <button class="calc-button">4</button>
            <button class="calc-button">5</button>
            <button class="calc-button">6</button>
            <button class="calc-button">&minus;</button>
          </div>
          <div class="calc-button-row">
            <button class="calc-button">1</button>
            <button class="calc-button">2</button>
            <button class="calc-button">3</button>
            <button class="calc-button">&plus;</button>
          </div>
          <div class="calc-button-row">
            <button class="calc-button zero-button">0</button>
            <button class="calc-button">&equals;</button>
          </div>
        </section>
      </div>

      <aside class="history-panel" aria-live="polite">
        <div class="history-header">
          <h2>Histórico</h2>
          <button id="clear-history" class="clear-history" type="button">
            Limpar
          </button>
        </div>
        <ul id="history" class="history-list">
          <li class="history-empty">Nenhum cálculo ainda.</li>
        </ul>
      </aside>
    </div>

    <footer>
      <p>&copy;Desenvolvido por Carlos Resende</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
